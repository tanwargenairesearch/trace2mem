name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.6'
      - run: go test -race ./...
      - run: go vet ./...
      - name: LangChain adapter
        run: |
          python3 -m venv /tmp/trace2mem-python
          /tmp/trace2mem-python/bin/pip install --require-hashes -r integrations/langchain/requirements.lock
          /tmp/trace2mem-python/bin/pip install --no-deps ./integrations/langchain
          /tmp/trace2mem-python/bin/python -m unittest discover -s integrations/langchain/tests -v
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - run: scripts/acceptance.sh
      - if: always()
        run: docker compose down
