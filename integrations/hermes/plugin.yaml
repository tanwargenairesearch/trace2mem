name: trace2mem
version: 0.1.0
description: Durable conversation capture and progressive memory retrieval
provides_hooks:
  - on_session_start
  - pre_llm_call
  - post_llm_call
  - post_tool_call
  - on_session_finalize
provides_tools:
  - memory_search
  - memory_read
  - memory_evidence
requires_env:
  - TRACE2MEM_URL
  - TRACE2MEM_TOKEN
  - TRACE2MEM_SPOOL
