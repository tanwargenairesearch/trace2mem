[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trace2mem-langchain"
version = "0.1.0"
description = "Per-user trajectory capture and memory retrieval for Trace2Mem"
requires-python = ">=3.10"
dependencies = ["langchain-core==1.6.2"]
license = "Apache-2.0"

[tool.setuptools.packages.find]
where = ["src"]
